<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Data Driver</title>
    <link rel="stylesheet" href="css.css">
</head>
<body>

    <div class="container">
        <h1>Form Tambah Driver / Pengemudi</h1>

        <!-- Form Input yang mengarah ke simpan.php -->
        <div class="form-card">
            <h2>Masukkan Data Driver Baru</h2>
            <form action="simpan.php" method="POST">
                <div class="form-group">
                    <label>Nama Driver</label>
                    <input type="text" name="nama_driver" placeholder="Masukkan nama lengkap..." required>
                </div>

                <div class="form-group">
                    <label>Nomor SIM</label>
                    <input type="text" name="nomor_sim" placeholder="Masukkan nomor SIM..." required>
                </div>

                <div class="form-group">
                    <label>Status</label>
                    <select name="status">
                        <option value="Aktif">Aktif</option>
                        <option value="Tidak Aktif">Tidak Aktif</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Kontak</label>
                    <input type="text" name="kontak" placeholder="Masukkan nomor telepon/kontak..." required>
                </div>

                <button type="submit">Simpan Data</button>
            </form>
        </div>
        
        <br>
        <a href="tampil.php" style="color: #3498db; text-decoration: none; font-weight: 500;">&larr; Lihat Daftar Driver yang Tersimpan</a>
    </div>

</body>
</html>
